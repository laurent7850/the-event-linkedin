name: CI

# Vérifie chaque PR (dont celles de Dependabot) et chaque push sur main :
# une PR rouge ne doit pas être fusionnée.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20        # même version que frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20        # même version que backend/Dockerfile
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build (tsc)
        run: npm run build
